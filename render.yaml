services:
  - type: web
    name: verdant-support-assistant
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: AGENT_EMAIL
        value: agent@verdant.test
      - key: AGENT_PASSWORD
        sync: false
      - key: AGENT_NAME
        value: Verdant Support
      - key: WEBHOOK_SECRET
        value: verdant-demo-secret-2026
      - key: BRAND_ID
        value: verdant-co
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TIMEOUT_SECONDS
        value: "15"
      - key: COOKIE_SECURE
        value: "true"

